    - generic [ref=f8e44]:
      - generic [ref=f8e48]:
        - heading "Cloud Run pricing" [level=2] [ref=f8e49]
        - generic [ref=f8e51]:
          - paragraph [ref=f8e52]: Cloud Run charges you only for the resources you use, rounded up to the nearest 100 millisecond. Your total Cloud Run bill will be the sum of the resource usage in the pricing table after the free tier is applied.
          - paragraph [ref=f8e53]:
            - text: When setting
            - link "concurrency" [ref=f8e54] [cursor=pointer]:
              - /url: https://cloud.google.com/run/docs/about-concurrency
            - text: higher than one request at a time, multiple requests can share the allocated CPU and memory of an instance.
          - paragraph [ref=f8e55]:
            - text: Outbound internet data transfer uses the
            - link "Premium Network Service Tier" [ref=f8e56] [cursor=pointer]:
              - /url: https://cloud.google.com/network-tiers/docs/overview#premium_tier
            - text: and is charged at
            - link "Google Cloud networking pricing" [ref=f8e57] [cursor=pointer]:
              - /url: https://cloud.google.com/vpc/network-pricing
            - text: with a free tier of 1GiB free data transfer within North America per month.
          - paragraph [ref=f8e58]:
            - text: Data transfer to Virtual Private Cloud networks is billed as Data transfer from a VM and charged at
            - link "Virtual Private Cloud data transfer rates" [ref=f8e59] [cursor=pointer]:
              - /url: https://cloud.google.com/vpc/network-pricing#egress
            - text: . Serverless VPC Access connectors also charge for the compute required to run them. See
            - link "Serverless VPC Access pricing" [ref=f8e60] [cursor=pointer]:
              - /url: https://cloud.google.com/vpc/network-pricing#serverless-vpc-pricing
            - text: .
          - paragraph [ref=f8e61]:
            - text: There is no charge for data transfer to Google Cloud resources in the same region (for example for traffic from one Cloud Run service to another Cloud Run service). There is no charge for data transfer to
            - link "Media CDN" [ref=f8e62] [cursor=pointer]:
              - /url: https://cloud.google.com/media-cdn/docs
            - text: ","
            - link "Cloud CDN" [ref=f8e63] [cursor=pointer]:
              - /url: https://cloud.google.com/cdn/docs
            - text: and
            - link "Cloud Load Balancing" [ref=f8e64] [cursor=pointer]:
              - /url: https://cloud.google.com/load-balancing
            - text: .
      - generic [ref=f8e67]:
        - generic [ref=f8e68]:
          - generic [ref=f8e71]:
            - heading "Pricing considerations" [level=2] [ref=f8e72]
            - generic [ref=f8e75]:
              - paragraph [ref=f8e76]: "When evaluating the pricing of Cloud Run, consider the following:"
              - list [ref=f8e77]:
                - listitem [ref=f8e78]: "On-demand and pay per use: Cloud Run provides on-demand capacity and automatically scales instances. Cloud Run does not require pre-provisioning infrastructure to accommodate for anticipated peak usage. Container instances billed by Cloud Run are used container instances."
                - listitem [ref=f8e79]:
                  - text: "Total cost of ownership: While Cloud Run charges for compute costs, Cloud Run provides more value. For example, Cloud Run offers"
                  - link "zonal redundancy" [ref=f8e80] [cursor=pointer]:
                    - /url: https://cloud.google.com/run/docs/zonal-redundancy
                  - text: ", requires low operations because"
                  - link "Site Reliability Engineers" [ref=f8e81] [cursor=pointer]:
                    - /url: https://sre.google/
                  - text: do a lot in the background, makes you and your team more productive via its simplicity.
                - listitem [ref=f8e82]:
                  - text: "Committed use discounts: The cost of any continuous use of Cloud Run can be lowered by purchasing"
                  - link "Committed use discounts" [ref=f8e83] [cursor=pointer]:
                    - /url: https://docs.cloud.google.com/run/cud
                  - text: . For example, if your Cloud Run service always has one or more active instances, you can lower its cost by committing to at least this amount. Compute flexible committed use discounts apply across GKE, Compute Engine and Cloud Run.
              - paragraph [ref=f8e84]:
                - text: Read more about
                - link "cost optimization" [ref=f8e85] [cursor=pointer]:
                  - /url: https://cloud.google.com/architecture/framework/cost-optimization
                - text: .
          - generic [ref=f8e88]:
            - heading [level=3] [ref=f8e89]:
