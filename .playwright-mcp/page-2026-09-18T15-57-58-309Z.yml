    - generic [ref=f16e44]:
      - generic [ref=f16e48]:
        - heading "Cloud Run 가격 책정" [level=2] [ref=f16e49]
        - generic [ref=f16e51]:
          - paragraph [ref=f16e52]: Cloud Run은 약 100밀리초 단위로 올림 처리하여 사용한 리소스에 대해서만 비용을 청구합니다. 총 Cloud Run 요금은 무료 등급이 적용된 후 가격 책정 표에 있는 리소스 사용량의 합계입니다.
          - paragraph [ref=f16e53]:
            - link "동시 실행" [ref=f16e54] [cursor=pointer]:
              - /url: https://cloud.google.com/run/docs/about-concurrency
            - text: 을 한 번에 2개 이상의 요청으로 설정하면 인스턴스의 할당된 CPU 및 메모리를 여러 요청이 공유할 수 있습니다.
          - paragraph [ref=f16e55]:
            - text: 아웃바운드 인터넷 데이터 전송은
            - link "프리미엄 네트워크 서비스 등급" [ref=f16e56] [cursor=pointer]:
              - /url: https://cloud.google.com/network-tiers/docs/overview#premium_tier
            - text: 을 사용하며
            - link "Google Cloud 네트워킹 가격 책정" [ref=f16e57] [cursor=pointer]:
              - /url: https://cloud.google.com/vpc/network-pricing
            - text: 에 따라 요금이 청구됩니다. 북미 내에서 매월 1GiB의 무료 데이터 전송이 제공됩니다.
          - paragraph [ref=f16e58]:
            - text: Virtual Private Cloud 네트워크로의 데이터 전송은 VM에서의 데이터 전송으로 청구되며
            - link "Virtual Private Cloud 데이터 전송 요금" [ref=f16e59] [cursor=pointer]:
              - /url: https://cloud.google.com/vpc/network-pricing#egress
            - text: 이 적용됩니다. 서버리스 VPC 액세스 커넥터는 실행에 필요한 컴퓨팅에 대해서도 요금을 청구합니다.
            - link "서버리스 VPC 액세스 가격 책정" [ref=f16e60] [cursor=pointer]:
              - /url: https://cloud.google.com/vpc/network-pricing#serverless-vpc-pricing
            - text: 을 참조하세요.
          - paragraph [ref=f16e61]:
            - text: "동일한 리전의 Google Cloud 리소스로의 데이터 전송 (예: 하나의 Cloud Run 서비스에서 다른 Cloud Run 서비스로의 트래픽)에는 요금이 부과되지 않습니다."
            - link "Media CDN" [ref=f16e62] [cursor=pointer]:
              - /url: https://cloud.google.com/media-cdn/docs
            - text: ","
            - link "Cloud CDN" [ref=f16e63] [cursor=pointer]:
              - /url: https://cloud.google.com/cdn/docs
            - text: ","
            - link "Cloud Load Balancing" [ref=f16e64] [cursor=pointer]:
              - /url: https://cloud.google.com/load-balancing
            - text: 으로의 데이터 전송에는 요금이 부과되지 않습니다.
      - generic [ref=f16e67]:
        - generic [ref=f16e68]:
          - generic [ref=f16e71]:
            - heading "가격 책정 고려사항" [level=2] [ref=f16e72]
            - generic [ref=f16e75]:
              - paragraph [ref=f16e76]: Cloud Run의 가격 책정을 평가할 때는 다음 사항을 고려하세요.
              - list [ref=f16e77]:
                - listitem [ref=f16e78]: "주문형 및 사용량 기반 요금: Cloud Run은 주문형 용량을 제공하고 인스턴스를 자동으로 확장합니다. Cloud Run은 예상되는 최대 사용량을 수용하기 위해 인프라를 사전 프로비저닝할 필요가 없습니다. Cloud Run에서 청구되는 컨테이너 인스턴스는 사용된 컨테이너 인스턴스입니다."
                - listitem [ref=f16e79]:
                  - text: "총 소유 비용: Cloud Run은 컴퓨팅 비용에 대해 요금을 청구하지만 더 많은 가치를 제공합니다. 예를 들어 Cloud Run은"
                  - link "영역 중복" [ref=f16e80] [cursor=pointer]:
                    - /url: https://cloud.google.com/run/docs/zonal-redundancy
                  - text: 을 제공하며,
                  - link "사이트 안정성 엔지니어" [ref=f16e81] [cursor=pointer]:
                    - /url: https://sre.google/
                  - text: 가 백그라운드에서 많은 작업을 수행하므로 운영 부담이 적고, 단순성을 통해 사용자와 팀의 생산성을 높여줍니다.
                - listitem [ref=f16e82]:
                  - text: "약정 사용 할인:"
                  - link "약정 사용 할인" [ref=f16e83] [cursor=pointer]:
                    - /url: https://docs.cloud.google.com/run/cud
                  - text: 을 구매하여 Cloud Run의 지속적인 사용 비용을 절감할 수 있습니다. 예를 들어 Cloud Run 서비스에 항상 하나 이상의 활성 인스턴스가 있는 경우 최소한 이 정도의 인스턴스에 대해 약정을 체결하여 비용을 절감할 수 있습니다. Compute 가변형 약정 사용 할인은 GKE, Compute Engine, Cloud Run 전반에 적용됩니다.
              - paragraph [ref=f16e84]:
                - link "비용 최적화" [ref=f16e85] [cursor=pointer]:
                  - /url: https://cloud.google.com/architecture/framework/cost-optimization
                - text: 에 대해 자세히 알아보세요.
