            - paragraph [ref=f2e388]: 약정은 구매 후 1시간 이내에 활성화됩니다. 할인된 약정 지출 금액이 시간별 약정 수수료가 됩니다. 그 대가로 Cloud Billing 계정에 총 약정 지출 금액에 상응하는 시간별 크레딧이 제공됩니다. Google Cloud는 이러한 크레딧을 사용하여 가변형 CUD의 대상이 되는 사용량에 대한 시간당 지출을 상쇄합니다. 매월 말에 Google Cloud는 해당 월의 총 약정 수수료를 계산하고 해당 금액을 청구합니다.
            - paragraph [ref=f2e389]: 시간당 약정 수수료는 약정 기간 동안 최소 시간당 지출로 유지되고, 주문형 가격이 약정된 시간당 지출액으로 합산되는 리소스를 사용하지 않더라도 지불해야 합니다. 약정 기간 동안 리소스의 주문형 가격이 변경되더라도 약정 수수료는 동일하게 유지됩니다.
            - paragraph [ref=f2e390]: "중요: 단일 가변형 약정에는 Compute Engine, GKE, Cloud Run 전반의 적격한 지출이 포함됩니다 . 특정 가변형 약정에서는 적용받는 가변형 CUD의 크레딧이 개별 적격 지출 금액에 비례하여 이러한 서비스에 분산됩니다. Google Cloud 사용량이 Compute Engine으로 제한되는지 또는 이러한 다른 서비스에 걸쳐 있는지에 따라 약정에서 제공되는 가변형 CUD 크레딧에 차이가 있을 수 있습니다."
            - paragraph [ref=f2e391]: Compute Engine의 경우 다음 머신 시리즈의 메모리 및 vCPU에만 가변형 CUD를 받을 수 있습니다. 나열된 모든 머신 시리즈의 경우 사용 가능한 모든 머신 유형과 단독 테넌트 노드 유형이 대상에 해당합니다.
            - list [ref=f2e392]:
              - listitem [ref=f2e393]: "범용: C3, C3D, C4, C4A, C4D, E2, N1, N2, N2D, N4, N4, N4D, N4A (프리뷰 중, 정식 버전 출시 시 CUD 사용 가능) 머신 시리즈"
              - listitem [ref=f2e394]: "컴퓨팅 최적화:"
              - listitem [ref=f2e395]: H3 및 H4D 머신 시리즈 (새 모델로 옵트인한 후에만 사용 가능)
              - listitem [ref=f2e396]: C2 및 C2D 머신 시리즈
              - listitem [ref=f2e397]: "메모리 최적화: M1, M2, M3, M4 머신 시리즈 (새 모델로 옵트인한 후에만 사용 가능)"
              - listitem [ref=f2e398]: "스토리지 최적화: Z3 머신 시리즈"
            - paragraph [ref=f2e399]: 자세한 내용은 다음 문서를 참조하세요.
            - paragraph [ref=f2e400]: 가변형 CUD에 대해 자세히 알아보려면 Compute 가변형 CUD를 참조하세요.
            - list [ref=f2e401]:
              - listitem [ref=f2e402]: 지출 기반 약정을 구매하는 방법을 알아보려면 지출 기반 약정 구매를 참조하세요.
              - listitem [ref=f2e403]: 가변형 CUD에 적격한 Compute Engine SKU 전체 목록을 보려면 Compute 가변형 CUD 적격 SKU를 참조하세요.
              - listitem [ref=f2e404]: 지출 기반 약정을 확인, 분석, 관리하는 방법을 알아보려면 가변형 약정의 효과 분석을 참조하세요.
        - generic [ref=f2e405]:
          - button [ref=f2e406] [cursor=pointer]:
            - generic [ref=f2e407]:
              - heading "지속 사용 할인" [level=4] [ref=f2e408]
              - text: 
          - generic [ref=f2e411]:
            - paragraph [ref=f2e412]: Compute Engine은 청구 월의 25% 이상 사용되고 다른 할인을 받지 못하는 리소스에 대해 지속 사용 할인(SUD)을 제공합니다. 청구 월의 4분의 1 이상 해당 리소스를 사용할 때마다 지속적인 리소스 사용 시 추가 1시간에 대해 자동 할인 혜택을 받습니다. 사용량이 늘어날수록 할인이 점진적으로 증가하며, 한달 내내 실행된 가상 머신(VM) 인스턴스의 경우 리소스 비용에서 최대 30%의 순 할인을 받을 수 있습니다.
            - paragraph [ref=f2e413]: Compute Engine은 SUD를 자동으로 계산하여 Cloud Billing 계정 내 리소스 사용량에 적용하므로, 이러한 할인을 받기 위해 사용자가 취해야 할 조치는 없습니다.
            - paragraph [ref=f2e414]: SUD는 월별 크레딧 형태로 제공됩니다. 매월 말에 사용한 모든 적격 Compute Engine 리소스에 대해 해당 리소스를 사용한 기간에 따라 적용 가능한 SUD을 크레딧 형태로 받습니다. SUD로 받은 모든 크레딧은 현금 가치가 없습니다. Compute Engine은 이러한 크레딧을 사용하여 월간 리소스 사용 비용을 상쇄합니다. 크레딧을 받은 월이 지나면 크레딧을 저장하거나 사용할 수 없습니다.
            - paragraph [ref=f2e415]: 지속 사용 할인에 대한 자세한 내용은 SUD 문서를 참조하세요.
            - paragraph [ref=f2e416]: Google Cloud 콘솔의 Cloud Billing 계정에 대한 비용 테이블 보고서에서 특정 월에 적립된 모든 크레딧을 확인할 수 있습니다. 크레딧 및 크레딧 조회 방법에 대해 자세히 알아보려면 크레딧 보기 및 분석을 참조하세요.
        - generic [ref=f2e417]:
          - button [ref=f2e418] [cursor=pointer]:
            - generic [ref=f2e419]:
              - heading "할인 적용 순서" [level=4] [ref=f2e420]
              - text: 
          - generic [ref=f2e423]:
            - paragraph [ref=f2e424]: Cloud Billing 계정의 프로젝트에 대해 Compute Engine 리소스를 지원하기 위해 리소스 기반 및 가변형 약정을 모두 구매할 수 있습니다. 하지만 Google Cloud가 Compute Engine 리소스에 제공하는 할인 유형은 상호 배타적이어서 결합할 수 없습니다. 어느 시점에서든 리소스에는 한 가지 종류의 할인만 적용됩니다. 리소스 사용량의 일부에 대해 특정 유형의 할인을 받고 있다면 해당 사용량에 대해서는 다른 유형의 할인을 받을 수 없습니다.
            - paragraph [ref=f2e425]: 리소스 기반 약정을 사용하면 프로젝트, 리전, 머신 시리즈에 특정한 예측 가능하고 안정적인 리소스 사용량을 지원할 수 있습니다. 가변형 약정을 사용해서는 특정 머신 시리즈, 프로젝트 또는 리전에 해당하지 않는 모든 리소스 사용을 지원할 수 있습니다. Compute Engine 리소스에 대한 리소스 기반 약정과 가변형 약정을 모두 구매하면 Google Cloud는 다음과 같이 시간별로 약정 사용을 최적화합니다.
            - paragraph [ref=f2e426]: Google Cloud는 먼저 리소스 기반 약정을 활용하고 그 결과로 발생하는 모든 리소스 기반 CUD를 적합한 시간당 사용량에 적용합니다.
            - paragraph [ref=f2e427]: 그러면 Google Cloud는 지출 기반 약정을 활용하고 그 결과로 생성된 모든 가변형 CUD를 남은 모든 적합한 주문형 사용량에 적용합니다.
            - paragraph [ref=f2e428]: 모든 약정을 활용한 후 Google Cloud는 주문형 요율을 사용하여 시간당 추가 사용량을 청구합니다. 이러한 시간당 초과 사용량에는 해당 SUD가 적용될 수 있습니다.
            - paragraph [ref=f2e429]: 또한 모든 스팟 VM(및 선점형 VM)에 스팟 가격이 적용되므로 스팟 VM(및 선점형 VM)은 CUD 또는 SUD를 받을 수 없습니다.
            - paragraph [ref=f2e430]: 이 페이지의 머신 계열 및 머신 유형 섹션에 있는 가격표는 각 머신 계열의 머신 유형에 대한 주문형 가격과 다음 각 항목의 할인 가격을 비교합니다.
            - list [ref=f2e431]:
              - listitem [ref=f2e432]: 스팟 VM(및 선점형 VM)
              - listitem [ref=f2e433]: 1년 리소스 기반 약정
              - listitem [ref=f2e434]: 3년 리소스 기반 약정
              - listitem [ref=f2e435]: 1년 가변형 CUD 소비율
              - listitem [ref=f2e436]: 3년 가변형 CUD 소비율
