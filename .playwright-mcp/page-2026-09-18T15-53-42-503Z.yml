        - generic [ref=f2e244]:
          - button [expanded] [ref=f2e245] [cursor=pointer]:
            - generic [ref=f2e246]:
              - heading "모든 vCPU, GPU, 메모리 리소스의 청구 모델은 무엇인가요?" [level=4] [ref=f2e247]
              - text: 
          - generic [ref=f2e252]:
            - paragraph [ref=f2e253]: 다음 청구 모델은 모든 vCPU, GPU, 메모리 리소스에 적용됩니다. 이 청구 모델은 Compute Engine 인스턴스에서 실행하는 여러 프리미엄 이미지에도 적용됩니다.
            - paragraph [ref=f2e254]: 모든 vCPU, GPU, GB 단위 메모리의 최소 요금은 1분부터 시작됩니다. 예를 들어 가상 머신을 30초 동안 실행해도 사용량 1분에 해당하는 요금이 청구됩니다.
            - paragraph [ref=f2e255]: 1분 후에는 1초 단위로 인스턴스에 요금이 청구됩니다.
        - generic [ref=f2e256]:
          - button [ref=f2e257] [cursor=pointer]:
            - generic [ref=f2e258]:
              - heading "인스턴스 업타임은 어떻게 측정되나요?" [level=4] [ref=f2e259]
              - text: 
          - generic [ref=f2e262]:
            - paragraph [ref=f2e263]: 인스턴스 업타임은 인스턴스를 시작해 중지하기까지의 시간(초 단위)으로 측정됩니다. 중지 시의 인스턴스 상태는 STOPPING입니다. 인스턴스에 오류가 발생해 인스턴스가 시스템에서 STOPPING으로 표시되는 경우가 있는데, 이 경우 인스턴스가 STOPPING 상태에 도달한 이후의 사용량에 대해서는 요금이 청구되지 않습니다. 인스턴스가 유휴 상태이지만 여전히 RUNNING 상태라면 인스턴스 업타임 요금이 청구됩니다. 인스턴스 상태를 파악하는 가장 간편한 방법은 gcloud compute instances list 명령어와 함께 gcloud compute를 사용하거나 Google Cloud 콘솔을 방문하는 것입니다.
