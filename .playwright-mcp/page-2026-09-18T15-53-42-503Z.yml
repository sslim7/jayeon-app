      - generic [ref=f2e218]:
        - heading [level=2]
        - heading "가격 책정 개요" [level=3] [ref=f2e219]
        - generic [ref=f2e221]:
          - paragraph [ref=f2e222]: Compute Engine은 다음 가격표에 따라 사용량에 대한 요금을 청구합니다. 결제 주기가 끝날 때마다 Google Cloud 청구 총액이 합산된 청구서가 발송됩니다. 이 페이지의 가격은 미국 달러(USD)로 표기됩니다.
          - paragraph [ref=f2e223]: Compute Engine에서 디스크 크기, 머신 유형 메모리, 네트워크 사용량은 JEDEC 바이너리 기가바이트 (GB) 또는 IEC 기가바이트 (GiB) 단위로 계산되며, 1GiB는 230바이트입니다. 이와 유사하게 1TiB는 240바이트, 즉 1024JEDEC GB입니다.
          - paragraph [ref=f2e224]: USD 외의 통화로 지불하는 경우 Cloud Platform SKU에 해당 통화로 표기된 가격이 적용됩니다.
          - paragraph [ref=f2e225]: 디스크 및 이미지, 네트워킹, 단독 테넌시, Confidential VM 서비스 또는 VM 인스턴스에서 사용하는 GPU의 가격 책정은 설명하지 않습니다.
      - generic [ref=f2e231]:
