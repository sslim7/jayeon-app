      - generic [ref=f4e214]:
        - heading [level=2]
        - heading "Pricing overview" [level=3] [ref=f4e215]
        - generic [ref=f4e217]:
          - paragraph [ref=f4e218]: Compute Engine charges for usage based on the following price sheet. A bill is sent out at the end of each billing cycle, providing a sum of Google Cloud charges. Prices on this page are listed in U.S. dollars (USD).
          - paragraph [ref=f4e219]: For Compute Engine, disk size, machine type memory, and network usage are calculated in JEDEC binary gigabytes (GB), or IEC gibibytes (GiB), where 1 GiB is 230 bytes. Similarly, 1 TiB is 240 bytes, or 1024 JEDEC GBs.
          - paragraph [ref=f4e220]: If you pay in a currency other than USD, the prices listed in your currency on Cloud Platform SKUs apply.
          - paragraph [ref=f4e221]: This page does not cover pricing for any disk and images, networking, sole tenancy, Confidential VM service, or GPUs used by the VM instance.
      - generic [ref=f4e227]:
        - generic [ref=f4e228]:
          - paragraph [ref=f4e229]: FAQ
          - button "Toggle all" [ref=f4e233] [cursor=pointer]:
            - generic [ref=f4e235]: Expand all
        - generic [ref=f4e240]:
          - button [expanded] [ref=f4e241] [cursor=pointer]:
            - generic [ref=f4e242]:
              - heading "What is the billing model for all vCPUs, GPUs, and memory resources?" [level=4] [ref=f4e243]
              - text: 
          - generic [ref=f4e248]:
            - paragraph [ref=f4e249]: The following billing model applies to all vCPUs, GPUs, and memory resources. The billing model also applies to several premium images that you run on Compute Engine instances.
            - paragraph [ref=f4e250]: All vCPUs, GPUs, and GB of memory are charged a minimum of 1 minute. For example, if you run your virtual machine for 30 seconds, you will be billed for 1 minute of usage.
            - paragraph [ref=f4e251]: After 1 minute, instances are charged in 1 second increments.
        - generic [ref=f4e252]:
          - button [ref=f4e253] [cursor=pointer]:
            - generic [ref=f4e254]:
              - heading "How is Instance uptime measured?" [level=4] [ref=f4e255]
              - text: 
          - generic [ref=f4e258]:
            - paragraph [ref=f4e259]: Instance uptime is measured as the number of seconds between when you start an instance and when you stop an instance, the latter being when the instance state is STOPPING. In some cases, your instance can suffer from a failure and be marked as STOPPING by the system; in these cases, you will not be charged for usage after the instance reaches the STOPPING state. If an instance is idle, but still has a state of RUNNING, it will be charged for instance uptime. The easiest way to determine the status of an instance is to use gcloud compute with the gcloud compute instances list command or to visit the Google Cloud console.
            - paragraph [ref=f4e260]: In the case of reservations, instance uptime is measured as the number of seconds between when you create a reservation and when you delete that reservation. Reserved resources are billed at standard rates, whether they are started or not.
            - paragraph [ref=f4e261]: Note that Compute Engine bills for a minimum of 1 minute of usage, so if you use an instance for 30 seconds of uptime, you are billed for 1 minute. After 1 minute, your instance is billed on a per-second basis. For more information, see the billing model.
            - paragraph [ref=f4e262]: "Note: If you are a Microsoft licensee with a contract that includes Software Assurance, you might be able to move your existing SQL Server licenses to Compute Engine, instead of paying a per-hour license fee. To find out more information about License Mobility, see the documentation for Using Existing Microsoft Licenses."
        - generic [ref=f4e263]:
          - button [ref=f4e264] [cursor=pointer]:
            - generic [ref=f4e265]:
              - heading "Resource-based pricing details" [level=4] [ref=f4e266]
              - text: 
          - generic [ref=f4e269]:
            - paragraph [ref=f4e270]: Each vCPU and each GB of memory on Compute Engine is billed separately rather than as part of a single machine type. You still create instances using predefined machine types, but your bill reports them as individual vCPUs and memory used per hour. If you change the number of threads per core, you are billed for the number of vCPUs defined by a VM's machine type, not the number of threads used by the VM.
            - paragraph [ref=f4e271]: The pricing tables in the machine family and machine type sections on this page describe prices for machine types based on vCPU and memory resources, but also include the calculated cost for each machine type. You can also use the Google Cloud Pricing Calculator to better understand prices for different configurations.
        - generic [ref=f4e272]:
          - button [ref=f4e273] [cursor=pointer]:
            - generic [ref=f4e274]:
              - heading "What discounts are available?" [level=4] [ref=f4e275]
              - text: 
          - generic [ref=f4e278]:
            - paragraph [ref=f4e279]: "vCPU and memory usage for each machine type use the on-demand price unless that usage qualifies for a discount. vCPU and memory usage for each machine type can receive one of the following discounts:"
            - list [ref=f4e280]:
              - listitem [ref=f4e281]: "Spot prices: automatic discounts for all Spot VMs (and preemptible VMs), which typically offer the largest discounts—up to 91% off of the corresponding on-demand price—are listed separately on the Spot VMs pricing page."
              - listitem [ref=f4e282]: "Note: Spot prices can change up to once every 30 days and don't appear in most pricing tables for Compute Engine. For the latest prices, see the Spot VMs pricing page."
              - listitem [ref=f4e283]: "Committed use discounts (CUDs): up to a 70% discount for memory-optimized machine types and up to a 55% discount for all other machine types."
              - listitem [ref=f4e284]: "Sustained use discounts (SUDs): automatic discount of up to 30% on resources that are used for more than 25% of a month and are not receiving any other discounts."
            - paragraph [ref=f4e285]: Discount types cannot be combined. For more information, see Order of discount application.
        - generic [ref=f4e286]:
          - button [ref=f4e287] [cursor=pointer]:
            - generic [ref=f4e288]:
              - heading "What are Spot prices?" [level=4] [ref=f4e289]
              - text: 
          - generic [ref=f4e292]:
            - paragraph [ref=f4e293]: Spot prices are variable and can change up to once every day, but provide discounts of up to 91% off of the corresponding default price for many machine types, GPUs, TPUs, and Local SSDs. Spot prices are automatically applied to all Spot VMs and preemptible VMs. However, Compute Engine can preempt Spot VMs and preemptible VMs at any time, so they are only recommended for fault-tolerant applications that can handle VM preemption.
            - paragraph [ref=f4e294]: For the latest prices, see the Spot VMs pricing page.
            - paragraph [ref=f4e295]:
              - text: For more information, see the
              - link "documentation for Spot VMs" [ref=f4e296] [cursor=pointer]:
                - /url: https://docs.cloud.google.com/compute/docs/instances/spot
              - text: .
        - generic [ref=f4e297]:
          - button [ref=f4e298] [cursor=pointer]:
            - generic [ref=f4e299]:
              - heading "What are committed use discounts" [level=4] [ref=f4e300]
              - text: 
          - generic [ref=f4e303]:
            - paragraph [ref=f4e304]: Compute Engine offers resources at deeply discounted prices in return for purchasing committed use contracts (also known as commitments). When you purchase a commitment, you commit either to a minimum amount of resource usage or to a minimum spend amount for a specified term of one or three years.
            - paragraph [ref=f4e305]: "Depending on your resource usage requirements, you can purchase 1-year or 3-year commitments and receive CUDs for Compute Engine resources in either of the following ways:"
            - list [ref=f4e306]:
              - listitem [ref=f4e307]: "Resource-based committed use discounts: You receive these CUDs when you purchase a resource-based commitment and commit to use a minimum level of Compute Engine resources in a particular region."
              - listitem [ref=f4e308]: "Compute flexible committed use discounts: You avail Compute flexible CUDs when you purchase a spend-based Compute flexible commitment and commit to a minimum amount of hourly spend."
        - generic [ref=f4e309]:
          - button [ref=f4e310] [cursor=pointer]:
            - generic [ref=f4e311]:
              - heading "What are Resource-based CUDs?" [level=4] [ref=f4e312]
              - text: 
          - generic [ref=f4e315]:
            - paragraph [ref=f4e316]: Compute Engine offers a flat committed use discount percentage on its VMs across all regions. When you purchase vCPUs, memory, or both on a 1-year commitment, you get the resources at a discount up to 37% over the on-demand prices. When you purchase your resources on a 3-year commitment, the discount increases to 70% over the on-demand prices for memory-optimized machine types and to 55% over the on-demand prices for all other machine types.
            - paragraph [ref=f4e317]: "Resource-based CUDs are available for the following machine types in each machine family, with the exception of Memory Optimized Upgrade Premium SKUs:"
            - list [ref=f4e318]:
              - listitem [ref=f4e319]: "General purpose:"
              - listitem [ref=f4e320]: All general purpose machine types except for N1 shared-core machine types
              - listitem [ref=f4e321]: All N1, N2, N2D, N4, C3, C3D, C4, C4A and C4D sole-tenant nodes
              - listitem [ref=f4e322]: "Memory-optimized:"
              - listitem [ref=f4e323]: All M1, M2, M3, machine types
              - listitem [ref=f4e324]: All M1, M2, M3, sole-tenant node types
              - listitem [ref=f4e325]: "Compute-optimized:"
              - listitem [ref=f4e326]: All compute-optimized (C2, C2D, and H3) machine types
              - listitem [ref=f4e327]: All C2 and H3 sole-tenant node types
              - listitem [ref=f4e328]: "Storage-optimized:"
              - listitem [ref=f4e329]: All Z3 machine types
              - listitem [ref=f4e330]: "Accelerator-optimized:"
              - listitem [ref=f4e331]: All A2, A3, and G2 machine types
              - listitem [ref=f4e332]: All G2 sole-tenant node types
            - paragraph [ref=f4e333]: For a more detailed breakdown, see Commitment types.
