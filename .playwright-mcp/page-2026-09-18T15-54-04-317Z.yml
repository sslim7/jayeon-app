              - text: 
          - generic [ref=f4e340]:
            - paragraph [ref=f4e341]: "A commitment provides a 1- or 3-year discounted price agreement, but it does not reserve capacity in a specific zone. A reservation ensures that capacity is held in a specific zone even if the reserved VMs are not running. To get zonal resources at discounted prices and also ensure that capacity is reserved for them, you must do both of the following: purchase commitments and create reservations for those zonal resources."
            - paragraph [ref=f4e342]: You can also attach reservations to your resource-based commitments to ensure that Compute Engine reserves capacity for your committed resources. When you commit to GPU or Local SSD resources, you must also reserve those resources and attach those reservations to your commitment.
            - paragraph [ref=f4e343]: For more information, see Combine reservations with committed use discounts.
        - generic [ref=f4e344]:
          - button [ref=f4e345] [cursor=pointer]:
            - generic [ref=f4e346]:
              - heading "Purchase resource-based commitments" [level=4] [ref=f4e347]
              - text: 
          - generic [ref=f4e350]:
            - paragraph [ref=f4e351]: "To learn how to purchase resource-based commitments, see the following:"
            - paragraph [ref=f4e352]:
              - link "Purchase commitments without attached reservations" [ref=f4e353] [cursor=pointer]:
                - /url: https://docs.cloud.google.com/compute/docs/instances/signing-up-committed-use-discounts#purchasecommitment
            - paragraph [ref=f4e354]:
              - link "Purchase commitments with attached reservations" [ref=f4e355] [cursor=pointer]:
                - /url: https://docs.cloud.google.com/compute/docs/instances/signing-up-committed-use-discounts#purchasecommitmentgpuslocalssd
        - generic [ref=f4e356]:
          - button [ref=f4e357] [cursor=pointer]:
            - generic [ref=f4e358]:
              - heading "Pricing for resource-based commitments" [level=4] [ref=f4e359]
              - text: 
          - generic [ref=f4e362]:
            - paragraph [ref=f4e363]: After you purchase a resource-based commitment, you're billed monthly for your commitment and must pay your monthly commitment fee even if you don't use all of your committed resources. Your commitment fee is the sum of the discounted prices of all your committed resources. Compute Engine calculates the discounted price of each resource by using its prevailing on-demand price on the day your commitment becomes active. Your monthly commitment fee and the discounted prices for your resources stay the same until the end of your commitment term, even if the on-demand prices change.
            - paragraph [ref=f4e364]: If you use your commitments to run custom machine types, then Compute Engine charges a 5% premium over the commitment prices. Compute Engine charges this premium for the portion and duration of your commitment that you run these custom machine type VMs.
            - paragraph [ref=f4e365]: "Note: If you merge or split your commitments, then the discounted prices for your committed resources might change on the day your merged or split commitments become active."
        - generic [ref=f4e366]:
          - button [ref=f4e367] [cursor=pointer]:
            - generic [ref=f4e368]:
              - heading "What are Compute flexible CUDs" [level=4] [ref=f4e369]
              - text: 
          - generic [ref=f4e372]:
            - paragraph [ref=f4e373]: "Compute flexible CUDs are spend-based CUDs that you receive when you commit to a minimum amount of hourly spend on one or more of the following services:"
            - list [ref=f4e374]:
              - listitem [ref=f4e375]: Compute Engine
              - listitem [ref=f4e376]: Google Kubernetes Engine
              - listitem [ref=f4e377]: Cloud Run
            - paragraph [ref=f4e378]: For Compute Engine, you can receive flexible CUDs for your vCPU and memory usage in any of the projects within your Cloud Billing account, across any region, and belonging to any eligible machine types.
            - paragraph [ref=f4e379]: "You purchase flexible commitments for your Cloud Billing account and commit to a minimum hourly spend amount across these products for a 1-year or 3-year term duration. Specifically, you commit to spend on eligible resources or services that are worth a specified minimum amount of on-demand price, per hour, throughout the commitment's term. Depending on your commitment's term, you receive the following CUDs on that minimum hourly spend amount:"
            - list [ref=f4e380]:
              - listitem [ref=f4e381]: A 28% discount over your committed hourly spend amount for a 1-year commitment
              - listitem [ref=f4e382]: A 46% discount over your committed hourly spend amount for a 3-year commitment
            - paragraph [ref=f4e383]: "Note: The discounts that you receive may differ for Cloud Billing accounts that have other on-demand VM savings in effect."
            - paragraph [ref=f4e384]: Your commitment becomes active within the first hour of its purchase. This discounted committed spend amount becomes your hourly commitment fee. In return, you receive hourly credits on your Cloud Billing account that are worth your total committed spend amount. Google Cloud uses these credits to offset your hourly spend on usage that is eligible for flexible CUDs. At the end of each month, Google Cloud calculates your total commitment fee for that month and bills you that amount.
            - paragraph [ref=f4e385]: Your hourly commitment fee remains your minimum hourly expenditure throughout the commitment term and you have to pay it even if you don't use resources whose on-demand prices total up to your committed hourly spend. Your commitment fee remains the same even if the on-demand prices for your resources change during your commitment term.
            - paragraph [ref=f4e386]: "Important: A single flexible commitment covers your eligible spend across Compute Engine, GKE, and Cloud Run . For any given flexible commitment, the credits from flexible CUDs that you receive are distributed across these services in proportion to their individual eligible spend amounts. Depending on whether your Google Cloud usage is limited to Compute Engine or also spans across these other services, you might see differences in the flexible CUD credits that you receive for your commitment."
            - paragraph [ref=f4e387]: For Compute Engine, only memory and vCPUs of the following machine series are eligible for flexible CUDs. For every listed machine series, all available machine types and sole-tenant node types are eligible.
            - list [ref=f4e388]:
              - listitem [ref=f4e389]: "General purpose: C3, C3D, C4, C4A, C4D, E2, N1, N2, N2D, N4, N4, N4D, and N4A (In Preview; CUDs available at GA) machine series"
              - listitem [ref=f4e390]: "Compute-optimized:"
              - listitem [ref=f4e391]: H3 and H4D machine series (Available only after opting in to the new model)
              - listitem [ref=f4e392]: C2 and C2D machine series
              - listitem [ref=f4e393]: "Memory-optimized: M1, M2, M3, and M4 machine series (Available only after opting in to the new model)"
              - listitem [ref=f4e394]: "Storage-optimized: Z3 machine series"
            - paragraph [ref=f4e395]: "For more information, see the following documents:"
            - paragraph [ref=f4e396]: To learn more about flexible CUDs, see Compute flexible CUDs.
            - list [ref=f4e397]:
              - listitem [ref=f4e398]: To learn how to purchase spend-based commitments, see Purchasing spend-based commitments.
              - listitem [ref=f4e399]: To view the full list of Compute Engine SKUs that are eligible for flexible CUDs, see Compute flexible CUDs eligible SKUs.
              - listitem [ref=f4e400]: To learn how to view, analyze, and manage your spend-based commitments, see Analyze the effectiveness of flexible commitments.
        - generic [ref=f4e401]:
          - button [ref=f4e402] [cursor=pointer]:
            - generic [ref=f4e403]:
              - heading "Sustained use discounts" [level=4] [ref=f4e404]
              - text: 
          - generic [ref=f4e407]:
            - paragraph [ref=f4e408]: Compute Engine offers sustained use discounts (SUDs) on resources that are used for more than 25% of a billing month and are not receiving any other discounts. Whenever you use an applicable resource for more than a fourth of a billing month, you automatically receive a discount for every incremental hour that you continue to use that resource. The discount increases incrementally with usage and you can get up to a 30% net discount off of the resource cost for virtual machine (VM) instances that run the entire month.
            - paragraph [ref=f4e409]: Compute Engine automatically calculates and applies SUDs to resource usage within a Cloud Billing account, so there is no action required on your part to enable these discounts.
            - paragraph [ref=f4e410]: You receive SUDs in the form of monthly credits. At the end of every month, for every eligible Compute Engine resource that you use, you receive applicable SUDs as credits based on the duration of time for which you used that resource. Any credits that you receive for your SUDs have no cash value. Compute Engine uses these credits to offset your monthly resource usage costs. You can't store or use these credits beyond the month in which you receive them.
            - paragraph [ref=f4e411]: To learn more about sustained use discounts, see the SUDs documentation.
            - paragraph [ref=f4e412]: You can view all your earned credits during a particular month in the cost table report for your Cloud Billing account on the Google Cloud console. To learn more about credits and how to view them, see View and analyze your credits.
        - generic [ref=f4e413]:
          - button [ref=f4e414] [cursor=pointer]:
            - generic [ref=f4e415]:
              - heading "Order of discount application" [level=4] [ref=f4e416]
              - text: 
          - generic [ref=f4e419]:
            - paragraph [ref=f4e420]: You can purchase both resource-based and flexible commitments to cover Compute Engine resources for projects within your Cloud Billing account. However, the discount types that Google Cloud offers on your Compute Engine resources are mutually exclusive and can't be combined. At any given point, a resource is eligible for only one kind of discount. If you're receiving a specific type of discount for a portion of your resource usage, then that portion of usage doesn't qualify for any other type of discount.
            - paragraph [ref=f4e421]: "You can use your resource-based commitments to cover your predictable and stable resource usage that is specific to a project, region, and a machine series. You can use flexible commitments to cover any resource usage that isn't specific to any one machine series, project, or region. If you purchase both resource-based commitments and flexible commitments for your Compute Engine resources, then Google Cloud optimizes the use of your commitments, on an hourly basis, in the following way:"
            - paragraph [ref=f4e422]: Google Cloud first utilizes your resource-based commitments and applies all the resulting resource-based CUDs to any eligible hourly usage.
            - paragraph [ref=f4e423]: Google Cloud then utilizes your spend-based commitments and applies all the resulting flexible CUDs to any remaining eligible on-demand usage.
            - paragraph [ref=f4e424]: After utilizing all of your commitments, Google Cloud uses the on-demand rates to charge any additional hourly usage. This overage hourly usage might be eligible for any applicable SUDs.
            - paragraph [ref=f4e425]: Additionally, spot prices apply to all Spot VMs (and preemptible VMs), so Spot VMs (and preemptible VMs) cannot receive CUDs or SUDs.
            - paragraph [ref=f4e426]: "The pricing tables in the machine family and machine type sections on this page compare the on-demand prices for machine types in each machine family with the discounted prices for each of the following:"
            - list [ref=f4e427]:
              - listitem [ref=f4e428]: Spot VMs (and preemptible VMs)
              - listitem [ref=f4e429]: 1-year resource-based commitments
              - listitem [ref=f4e430]: 3-year resource-based commitments
              - listitem [ref=f4e431]: 1-year flexible CUD consumption rates
              - listitem [ref=f4e432]: 3-year flexible CUD consumption rates
        - generic [ref=f4e433]:
          - button [ref=f4e434] [cursor=pointer]:
            - generic [ref=f4e435]:
              - heading "Viewing usage" [level=4] [ref=f4e436]
              - text: 
          - generic [ref=f4e439]:
            - paragraph [ref=f4e440]: The Google Cloud console provides a transaction history for each of your projects. This history describes your current balance and estimated resource usage for that particular project.
            - paragraph [ref=f4e441]: To view a project's transaction history, go to the estimated billing invoice page.
