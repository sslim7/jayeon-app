    - generic [ref=f14e12]:
      - generic [ref=f14e16]:
        - heading "가속기 최적화 가격 책정" [level=2] [ref=f14e17]
        - generic [ref=f14e19]:
          - paragraph [ref=f14e20]:
            - text: 이 페이지는 편의상 가속기 최적화 머신 유형 계열의 모든 가격 정보를 한곳에 모아 보여줍니다. 참조용으로 제공됩니다. 가격 책정에 대한 자세한 내용은
            - link "가격 책정 방식" [ref=f14e21] [cursor=pointer]:
              - /url: /products/compute/pricing/compute-optimized#how-pricing-works
            - text: 섹션을 참고하세요.
          - list [ref=f14e22]:
            - listitem [ref=f14e23]: "참고: 이 페이지에서는 자세한 가격 설명을 제공하지 않습니다."
          - paragraph [ref=f14e24]: Compute Engine은 다음 가격표에 따라 사용량에 대한 요금을 청구합니다. 결제 주기가 끝날 때마다 Google Cloud 청구 총액이 합산된 청구서가 발송됩니다. 이 페이지의 가격은 미국 달러(USD)로 표기됩니다.
          - paragraph [ref=f14e25]:
            - text: Compute Engine에서 디스크 크기, 머신 유형 메모리, 네트워크 사용량은 JEDEC 바이너리 기가바이트 (GB), 즉 기비바이트 (GiB) 단위로 계산되며, 1GiB는 2
            - superscript [ref=f14e26]: "30"
            - text: 바이트입니다. 이와 유사하게 1TiB는 2
            - superscript [ref=f14e27]: "40"
            - text: 바이트, 즉 1024JEDEC GB입니다.
          - paragraph [ref=f14e28]:
            - text: USD 외의 통화로 지불하는 경우
            - link "Cloud Platform SKU" [ref=f14e29] [cursor=pointer]:
              - /url: https://cloud.google.com/skus/
            - text: 에 해당 통화로 표기된 가격이 적용됩니다.
          - paragraph [ref=f14e30]:
            - text: 이 페이지에서는 GPU 머신 유형의 가격 정보를 제공합니다. TPU 가격 책정은
            - link "Cloud TPU 가격 책정" [ref=f14e31] [cursor=pointer]:
              - /url: https://cloud.google.com/tpu/pricing
            - text: 을 참조하세요.
      - generic [ref=f14e35]:
        - heading "GPU 가속 머신 가격 책정" [level=2] [ref=f14e39]
        - generic [ref=f14e45]:
          - paragraph [ref=f14e46]:
            - link "GPU가 사전 연결된 가속기 최적화 VM" [ref=f14e47] [cursor=pointer]:
              - /url: https://cloud.google.com/compute/docs/accelerator-optimized-machines
            - text: 은 머신러닝 (ML) 및 고성능 컴퓨팅 (HPC)과 같은
            - link "동시에 로드되는 대규모 CUDA 컴퓨팅 워크로드" [ref=f14e48] [cursor=pointer]:
              - /url: https://developer.nvidia.com/cuda-zone
            - text: 에 최적화되어 있습니다.
          - paragraph [ref=f14e49]: GPU 가속 머신은 연결된 GPU, 사전 정의된 vCPU, 메모리, 번들 로컬 SSD 스토리지 (해당하는 경우)에 대한 요금이 청구됩니다.
          - paragraph [ref=f14e50]: 각 GPU 가속화 머신 유형을 실행하는 데 드는 총비용은 다음 표에 나와 있습니다. 커스텀 메모리 옵션을 사용할 수 있는 VM의 경우 계산에 기본 메모리 값이 사용됩니다. 이러한 머신 유형에는 지속 사용 할인 또는 가변형 약정 사용 할인이 적용되지 않습니다.
          - paragraph [ref=f14e51]:
            - link "DWS 가격" [ref=f14e52] [cursor=pointer]:
              - /url: https://cloud.google.com/products/dws/pricing?_gl=1*1uosrhk*_ga*MTI1MzQ5MzEwNi4xNzYzNzUwOTQ4*_ga_4LYFWVHBEB*czE3NjQ3MTI4NjMkbzMkZzEkdDE3NjQ3MTQ4MTgkajQzJGwwJGgw
            - text: 은 변동될 수 있지만 자주 업데이트되지는 않습니다. 인스턴스가 실행될 때 적용되는 가격을 지불합니다. 자세한 내용은
            - link "Flex-start" [ref=f14e53] [cursor=pointer]:
              - /url: https://cloud.google.com/compute/docs/instance-groups/about-resize-requests-mig?_gl=1*1uosrhk*_ga*MTI1MzQ5MzEwNi4xNzYzNzUwOTQ4*_ga_4LYFWVHBEB*czE3NjQ3MTI4NjMkbzMkZzEkdDE3NjQ3MTQ4MTgkajQzJGwwJGgw
            - text: 문서와
            - link "Calendar 모드 문서" [ref=f14e54] [cursor=pointer]:
              - /url: https://cloud.google.com/compute/docs/instances/future-reservations-calendar-mode-overview?_gl=1*jm4j8l*_ga*MTI1MzQ5MzEwNi4xNzYzNzUwOTQ4*_ga_4LYFWVHBEB*czE3NjQ3MTI4NjMkbzMkZzEkdDE3NjQ3MTQ4MTgkajQzJGwwJGgw
            - text: 를 참조하세요.
