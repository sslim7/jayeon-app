              - /url: https://cloud.google.com/compute/docs/instances/future-reservations-calendar-mode-overview?_gl=1*jm4j8l*_ga*MTI1MzQ5MzEwNi4xNzYzNzUwOTQ4*_ga_4LYFWVHBEB*czE3NjQ3MTI4NjMkbzMkZzEkdDE3NjQ3MTQ4MTgkajQzJGwwJGgw
