      - generic [ref=f6e16]:
        - heading "Accelerator-optimized pricing" [level=2] [ref=f6e17]
        - generic [ref=f6e19]:
          - paragraph [ref=f6e20]:
            - text: This page lists all the pricing for Accelerator-optimized machine type family in a single place for convenience. It is intended for reference purposes. You can find more detail on pricing in the
            - link "How pricing works" [ref=f6e21] [cursor=pointer]:
              - /url: /products/compute/pricing/compute-optimized#how-pricing-works
            - text: section.
          - list [ref=f6e22]:
            - listitem [ref=f6e23]: "Note: This page does not provide detailed pricing explanations."
          - paragraph [ref=f6e24]: Compute Engine charges for usage based on the following price sheet. A bill is sent out at the end of each billing cycle, providing a sum of Google Cloud charges. Prices on this page are listed in U.S. dollars (USD).
          - paragraph [ref=f6e25]:
            - text: For Compute Engine, disk size, machine type memory, and network usage are calculated in JEDEC binary gigabytes (GB) also known as gibibytes (GiB), where 1 GiB is 2
            - superscript [ref=f6e26]: "30"
            - text: bytes. Similarly, 1 TiB is 2
            - superscript [ref=f6e27]: "40"
            - text: bytes, or 1024 JEDEC GBs.
          - paragraph [ref=f6e28]:
            - text: If you pay in a currency other than USD, the prices listed in your currency on
            - link "Cloud Platform SKUs" [ref=f6e29] [cursor=pointer]:
              - /url: https://cloud.google.com/skus/
            - text: apply.
          - paragraph [ref=f6e30]:
            - text: This page provides the pricing information of GPU machine types. For TPU pricing, see
            - link "Cloud TPU pricing" [ref=f6e31] [cursor=pointer]:
              - /url: https://cloud.google.com/tpu/pricing
            - text: .
      - generic [ref=f6e35]:
        - heading "GPU-accelerated machines pricing" [level=2] [ref=f6e39]
        - generic [ref=f6e45]:
          - paragraph [ref=f6e46]:
            - link "Accelerator-optimized VMs that have pre-attached GPUs" [ref=f6e47] [cursor=pointer]:
              - /url: https://cloud.google.com/compute/docs/accelerator-optimized-machines
            - text: are optimized for
            - link "massively parallelized CUDA compute workloads" [ref=f6e48] [cursor=pointer]:
              - /url: https://developer.nvidia.com/cuda-zone
            - text: ", such as machine learning (ML) and high performance computing (HPC)."
          - paragraph [ref=f6e49]: The GPU-accelerated machines are billed for their attached GPUs, predefined vCPU, memory, and bundled Local SSD storage (if applicable).
          - paragraph [ref=f6e50]: The total cost of running each GPU-accelerated machine type is shown in the following tables. For VMs that have custom memory options available, the default memory value is used in the calculation. These machine types are not eligible for sustained use discounts or flexible committed use discounts.
          - paragraph [ref=f6e51]:
            - link "DWS Prices" [ref=f6e52] [cursor=pointer]:
              - /url: https://cloud.google.com/products/dws/pricing?_gl=1*1uosrhk*_ga*MTI1MzQ5MzEwNi4xNzYzNzUwOTQ4*_ga_4LYFWVHBEB*czE3NjQ3MTI4NjMkbzMkZzEkdDE3NjQ3MTQ4MTgkajQzJGwwJGgw
            - text: are variable, but are updated infrequently. You pay the price that is in effect when your instances are running. See
            - link "Flex-start" [ref=f6e53] [cursor=pointer]:
              - /url: https://cloud.google.com/compute/docs/instance-groups/about-resize-requests-mig?_gl=1*1uosrhk*_ga*MTI1MzQ5MzEwNi4xNzYzNzUwOTQ4*_ga_4LYFWVHBEB*czE3NjQ3MTI4NjMkbzMkZzEkdDE3NjQ3MTQ4MTgkajQzJGwwJGgw
            - text: documentation and
