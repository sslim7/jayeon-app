          - heading "GPU Attachment pricing" [level=2] [ref=f6e844]
          - generic [ref=f6e847]:
            - paragraph [ref=f6e848]: You can attach one or more GPUs to your virtual machine (VM) instances to accelerate specific workloads or offload work from your vCPUs. Each GPU adds to the cost of your instance in addition to the cost of the machine type. GPUs are subject to the same billing policy as vCPUs and memory.
            - paragraph [ref=f6e849]:
              - text: Compute Engine charges for usage based on the following price sheet. A bill is sent out at the end of each billing cycle, providing a sum of Google Cloud charges. Prices on this page are listed in U.S. dollars (USD). For Compute Engine, disk size, machine type memory, and network usage are calculated in JEDEC binary gigabytes (GB), or IEC gibibytes (GiB), where 1 GiB is 230 bytes. Similarly, 1 TiB is 240 bytes, or 1024 JEDEC GBs. If you pay in a currency other than USD, the prices listed in your currency on
              - link "Cloud Platform SKUs" [ref=f6e850] [cursor=pointer]:
                - /url: https://cloud.google.com/skus/
              - text: apply.
