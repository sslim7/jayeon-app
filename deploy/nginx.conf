# Cloud Run 위에서 expo export 결과(dist/)를 내보내는 정적 서버 설정.
# 형제 프로젝트 birdieup-app/deploy/nginx.conf 에서 이 프로젝트에 해당하는 것만 옮겼다.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 보안 헤더. 정적 서빙이라 줄 수 있는 것이 많지 않지만 이 둘은 부작용 없이 넣을 수 있다.
  # nosniff: 브라우저가 Content-Type 을 무시하고 내용으로 타입을 추측하지 못하게 한다.
  #
  # 🔴 **아래 location 마다 이 두 줄이 다시 나온다. 지우지 마라.**
  # nginx 의 add_header 는 "현재 레벨에 add_header 가 하나도 없을 때만" 상위에서 물려받는다
  # (전부 아니면 전무다). 모든 location 이 Cache-Control 때문에 자기 add_header 를 갖고
  # 있으므로, 여기 한 번만 적으면 **실제 응답에는 어디에도 붙지 않는다** — 서버 블록에
  # 적혀 있어서 붙는 줄 알기 쉬운데, 확인하려면 배포본의 응답 헤더를 직접 봐야 한다.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml
             font/ttf font/otf application/x-font-ttf application/vnd.ms-fontobject;

  # 🔴 이게 없으면 압축이 통째로 안 걸린다.
  # nginx 는 Via 헤더가 붙은 요청을 "프록시 요청"으로 보고, gzip_proxied 기본값 off 에서는
  # 압축을 건너뛴다. 앞단에 프록시(CDN·Hosting 등)를 두면 모든 요청에 Via 가 붙으므로
  # 기본값 그대로면 JS 번들이 무압축으로 나간다.
  # 근거: birdieup-app/deploy/nginx.conf — Firebase Hosting 뒤에 둔 운영 배포본에서
  # 3.6MB JS 가 무압축으로 나가는 것을 실측으로 확인했다.
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_vary on;

  # 해시 붙은 정적 에셋은 장기 캐시.
  #
  # 이 블록이 없으면 아래 `location /` 로 떨어지는데, 그러면 Cache-Control 이 없어
  # 앞단 프록시가 `private` 를 붙인다. 캐시가 전혀 안 걸려서 재방문마다 번들과 폰트를
  # 다시 받는다. 파일명에 내용 해시가 박혀 있으므로 immutable 이 안전하다.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # 폰트·이미지 등 번들 에셋. 위와 같은 이유로 장기 캐시한다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # 딥링크 검증 파일(assetlinks.json).
  # app.json 이 nature.redhead.kr 에 대해 autoVerify 인텐트 필터를 갖고 있어서,
  # 안드로이드가 이 경로를 직접 읽어 앱 링크를 검증한다.
  #
  # 이 블록이 없으면 아래 SPA 폴백에 먹혀 **없는 파일에도 200 과 index.html 이 나가고**,
  # 검증은 JSON 이 아닌 응답을 받아 조용히 실패한다. `try_files $uri =404` 로
  # 파일이 없으면 없다고 말하게 해야 배포 누락이 드러난다.
  #
  # 🔴 **이 블록만으로는 부족하다.** 앞단 Firebase Hosting 이 `appAssociation` 기본값
  # `AUTO` 로 이 경로만 가로채 자기가 만든 빈 배열(`[]`)을 내주기 때문이다 — 요청이 여기까지
  # 내려오지도 않는다. `redhead-terraform` 쪽에서 `appAssociation: NONE` 이어야 한다.
  # (형제 프로젝트가 같은 벽에 부딪혔다: birdieup-app/deploy/nginx.conf 의 같은 블록 주석)
  #
  # 참고: 아직 public/.well-known/assetlinks.json 은 이 저장소에 없다. 앱 서명 키가
  # 정해진 뒤에 추가해야 앱 링크가 실제로 검증된다.
  location /.well-known/ {
    default_type application/json;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # ── 홈 화면 설치(PWA) 에 쓰이는 루트 파일들 ──
  # 전부 public/ 에서 dist 루트로 복사돼 온다. 아래 SPA 폴백보다 **먼저** 잡아야 한다 —
  # 거기로 떨어지면 파일이 빠져도 index.html 이 200 으로 나가서, 배포 누락이
  # 「설치 버튼이 안 뜬다」로만 나타나고 응답만 봐서는 멀쩡해 보인다.

  # 🔴 서비스 워커는 절대 캐시하지 않는다.
  # 브라우저는 이 파일의 바이트가 바뀌어야 새 워커로 넘어간다. 여기에 만료 시간이 붙으면
  # 그 시간만큼 옛 워커가 그대로 돌고, 워커를 고쳐 배포해도 반영되지 않는다 — 캐시 사고를
  # 막으려고 둔 파일이 정작 캐시에 갇히는 상황이다.
  #
  # `Service-Worker-Allowed: /` 는 스코프를 루트로 넓히는 허가다. 지금은 파일이 루트에
  # 있어서 없어도 되지만, 워커가 하위 경로로 옮겨지면 이 헤더 없이는 등록이 조용히 거절된다.
  #
  # types 블록으로 타입을 못 박는 이유: nginx 판에 따라 .js 가 text/javascript 로 나가는데,
  # 워커 스크립트는 JavaScript MIME 이 아니면 등록 자체가 거부된다.
  location = /sw.js {
    types { application/javascript js; }
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # manifest 는 nginx 기본 mime.types 에 없어서 그냥 두면 application/octet-stream 으로
  # 나간다. 그 타입이면 브라우저가 manifest 로 읽지 않아 설치 조건이 통째로 무너진다.
  # 캐시하지 않는 이유는 start_url·아이콘이 여기 박혀 있어서다 — 낡은 사본이 남으면
  # 설치된 앱이 없어진 주소를 계속 연다.
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # 설치 아이콘. 파일명에 해시가 없으므로 `immutable` 은 쓸 수 없다(바꿔도 1년간 옛 아이콘이
  # 남는다). 하루면 설치 시점의 재요청을 줄이기에 충분하다.
  location /icons/ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location = /apple-touch-icon.png {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # expo-router 정적 출력: 경로 → 경로.html → 없으면 SPA 폴백
  location / {
    # 🔴 HTML 은 반드시 재검증시킨다.
    # `no-cache` 는 "저장하지 마라" 가 아니라 "저장은 하되 쓰기 전에 매번 물어봐라" 다
    # (바뀌지 않았으면 ETag 로 304, 실제 전송은 없다).
    #
    # index.html 에 어느 번들을 쓸지가 파일명으로 박혀 있고 그 번들은 immutable 로 1년
    # 캐시된다. 그래서 이 파일이 낡으면 새로 배포해도 브라우저는 옛 번들을 계속 불러온다.
    # 명시하지 않으면 앞단이 `private` 만 붙이는데, 만료 규칙이 없어 브라우저가 임의로
    # 캐시해 며칠씩 옛 앱이 도는 일이 생긴다(birdieup-app 운영에서 그렇게 나타났다).
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
